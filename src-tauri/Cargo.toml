[package]
name = "panda-gaming-desktop"
version = "0.1.1"
description = "Lightweight Android mirroring desktop controller"
authors = ["Panda Gaming"]
license = "Apache-2.0"
repository = "https://github.com/0xGaryWu/PandaGamingDesktop"
edition = "2021"

[lib]
name = "panda_gaming_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
